<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 440 270" width="440" height="270" role="img" aria-label="inkloom ai project card"><title>inkloom ai project card</title><defs><filter id="glow" x="-20%" y="-30%" width="140%" height="160%"><feGaussianBlur stdDeviation="2.4" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
<pattern id="scan" width="4" height="4" patternUnits="userSpaceOnUse"><rect width="4" height="1.3" fill="#000" opacity=".30"/></pattern>
<linearGradient id="bar" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#00ff9c" stop-opacity="0"/><stop offset=".5" stop-color="#00ff9c" stop-opacity=".09"/><stop offset="1" stop-color="#00ff9c" stop-opacity="0"/></linearGradient>
<linearGradient id="laser" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#00ff9c" stop-opacity="0"/><stop offset=".5" stop-color="#00ff9c" stop-opacity=".7"/><stop offset="1" stop-color="#00ff9c" stop-opacity="0"/></linearGradient></defs><style>
text{font-family:'Fira Code','JetBrains Mono','SF Mono',Menlo,Consolas,'Courier New',monospace}
.blink{animation:blink 1.05s steps(1) infinite}
@keyframes blink{0%,100%{opacity:1}50%{opacity:0}}
.pulse{animation:pulse 1.6s ease-in-out infinite}
@keyframes pulse{0%,100%{opacity:1}50%{opacity:.25}}
.sb{animation:sb 7s linear infinite}@keyframes sb{from{transform:translateY(-70px)}to{transform:translateY(270px)}}
.scanner{animation:scanline 3.2s ease-in-out infinite alternate}@keyframes scanline{0%{transform:translateY(0)}100%{transform:translateY(80px)}}
</style><rect x="1" y="1" width="438" height="268" rx="10" fill="#0a0e14" stroke="#00ff9c" stroke-opacity=".35"/><path d="M1 11a10 10 0 0 1 10-10h418a10 10 0 0 1 10 10v23H1z" fill="#0f1620"/><circle cx="24" cy="17" r="6" fill="#ff5f56"/><circle cx="46" cy="17" r="6" fill="#ffbd2e"/><circle cx="68" cy="17" r="6" fill="#27c93f"/><text x="220.0" y="22" font-size="12" fill="#6e7681" text-anchor="middle">~/inkloom — bash</text><line x1="1" y1="34" x2="439" y2="34" stroke="#00ff9c" stroke-opacity=".18"/><rect x="1" y="35" width="438" height="234" fill="#0a0e14"/><text x="20" y="74" font-size="24" font-weight="800" fill="#00ff9c" filter="url(#glow)">inkloom ai</text><rect class="blink" x="182" y="55" width="11" height="22" fill="#00ff9c"/><rect x="20" y="86" width="105" height="19" rx="3" fill="#00ff9c" fill-opacity=".12" stroke="#00ff9c"/><circle class="pulse" cx="30" cy="95.5" r="3" fill="#00ff9c"/><text x="38" y="99" font-size="11" font-weight="700" fill="#00ff9c">ROUND 2 BUILD</text><text x="20" y="136" font-size="12.5" fill="#c3ccd6">brand-governance engine:</text><text x="20" y="155" font-size="12.5" fill="#c3ccd6">audits copy &amp; visual assets,</text><text x="20" y="174" font-size="12.5" fill="#c3ccd6">verbatim citations &amp; certs</text><text x="20" y="206" font-size="11" fill="#00d9ff">FastAPI · React 18 · TypeScript</text><text x="20" y="222" font-size="11" fill="#00d9ff">Gemini 2.0 · 42 E2E Tests</text><line x1="258" y1="52" x2="258" y2="252" stroke="#00ff9c" stroke-opacity=".2" stroke-dasharray="3 4"/>
<!-- Interactive Document Scanner Graphics -->
<g transform="translate(280 65)">
  <!-- Document Sheet -->
  <rect x="0" y="0" width="130" height="90" rx="5" fill="#0d141d" stroke="#00ff9c" stroke-opacity=".5" stroke-width="1.5"/>
  <rect x="12" y="14" width="70" height="4" rx="2" fill="#00ff9c" fill-opacity=".7"/>
  <rect x="12" y="24" width="105" height="3" rx="1.5" fill="#6e7681"/>
  <rect x="12" y="32" width="90" height="3" rx="1.5" fill="#6e7681"/>
  <rect x="12" y="40" width="100" height="3" rx="1.5" fill="#6e7681"/>
  <rect x="12" y="48" width="60" height="3" rx="1.5" fill="#6e7681"/>
  <!-- Animated Laser Scan Bar -->
  <g class="scanner">
    <rect x="2" y="4" width="126" height="4" fill="url(#laser)"/>
    <line x1="2" y1="6" x2="128" y2="6" stroke="#00ff9c" stroke-width="1.5" filter="url(#glow)"/>
  </g>
  <!-- Compliance Score Badge -->
  <rect x="88" y="58" width="36" height="24" rx="3" fill="#00ff9c" fill-opacity=".15" stroke="#00ff9c"/>
  <text x="106" y="74" font-size="12" font-weight="800" fill="#00ff9c" text-anchor="middle">100</text>
</g>
<!-- Verified Chips -->
<g transform="translate(280 170)">
  <g>
    <rect x="0" y="0" width="130" height="20" rx="4" fill="#00ff9c" fill-opacity=".1" stroke="#00ff9c" stroke-opacity=".5"/>
    <text x="10" y="14" font-size="10.5" fill="#00ff9c">✔ SHA-256 Signed</text>
    <animate attributeName="opacity" values=".4;1;.4" dur="2.4s" repeatCount="indefinite"/>
  </g>
  <g transform="translate(0 26)">
    <rect x="0" y="0" width="130" height="20" rx="4" fill="#00d9ff" fill-opacity=".1" stroke="#00d9ff" stroke-opacity=".5"/>
    <text x="10" y="14" font-size="10.5" fill="#00d9ff">✔ OWASP Top 10</text>
    <animate attributeName="opacity" values="1;.4;1" dur="2.4s" repeatCount="indefinite"/>
  </g>
  <g transform="translate(0 52)">
    <rect x="0" y="0" width="130" height="20" rx="4" fill="#ffb000" fill-opacity=".1" stroke="#ffb000" stroke-opacity=".5"/>
    <text x="10" y="14" font-size="10.5" fill="#ffb000">✔ PII/Secret Scrub</text>
    <animate attributeName="opacity" values=".4;1;.4" dur="2.4s" begin="1.2s" repeatCount="indefinite"/>
  </g>
</g>
<rect x="1" y="35" width="438" height="234" fill="url(#scan)" pointer-events="none"/><rect class="sb" x="1" y="35" width="438" height="70" fill="url(#bar)"/></svg>
